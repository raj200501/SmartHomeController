# Smart Home Controller scenes
# Format:
#   scene,<name>,<summary>
#   <device_type>,<device_id>,<attributes>
#   end

scene,evening,Relaxing evening setup
light,light-living,power=on,brightness=40
light,light-kitchen,power=off
thermostat,thermo-main,target=21.5
camera,cam-front,streaming=on
end

scene,away,Secure the home
light,light-living,power=off
light,light-kitchen,power=off
thermostat,thermo-main,target=18.0
camera,cam-front,streaming=on
camera,cam-garage,streaming=on
end
